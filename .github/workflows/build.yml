name: Test e installer Mac

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install "mcp>=1.2" numpy pillow librosa soundfile opencv-python-headless pytest
      - run: python -m pytest -q tests

  pkg:
    # Il .pkg si costruisce su Linux con xar + mkbom: niente attesa dei Mac di GitHub
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strumenti per il formato pkg di Apple
        run: |
          sudo apt-get update && sudo apt-get install -y libxml2-dev libssl-dev zlib1g-dev autoconf cpio
          git clone --depth 1 https://github.com/hogliux/bomutils /tmp/bomutils
          make -C /tmp/bomutils -j4
          git clone --depth 1 https://github.com/mackyle/xar /tmp/xar
          cd /tmp/xar/xar
          sed -i 's/OpenSSL_add_all_ciphers/OPENSSL_init_crypto/' configure.ac
          sed -i '1i #include <stdlib.h>' lib/linuxattr.c
          ./autogen.sh --noconfigure
          CFLAGS="-O2 -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types" ./configure -q
          make -j4
      - name: Compila il .pkg
        run: installer/costruisci_pkg.sh /tmp/xar/xar/src/xar /tmp/bomutils/build/bin/mkbom
      - uses: actions/upload-artifact@v4
        with:
          name: ResolveToolkit-pkg
          path: ResolveToolkit-*.pkg
      - name: Release (solo sui tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ResolveToolkit-*.pkg
